{{- if and .Values.kafka.enabled .Values.kafka.metrics.jmx.enabled }}
# 브로커 JMX exporter 사이드카가 읽는 설정 파일 (Strimzi 예제 규칙)
# bitnami/kafka 차트는 metrics.jmx.config 뒤에 자체 규칙을 항상 덧붙이므로,
# 규칙 전체를 이 ConfigMap으로 만들고 kafka.metrics.jmx.existingConfigmap으로 지정한다.
# 키 이름은 사이드카가 읽는 파일명인 jmx-kafka-prometheus.yml과 같아야 한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-kafka-jmx
  labels:
    {{- include "skafka.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-jmx
data:
  jmx-kafka-prometheus.yml: |-
    jmxUrl: service:jmx:rmi:///jndi/rmi://127.0.0.1:{{ .Values.kafka.metrics.jmx.kafkaJmxPort | default 5555 }}/jmxrmi
    ssl: false
    {{- .Files.Get "files/jmx/strimzi-kafka-rules.yml" | nindent 4 }}
{{- end }}
